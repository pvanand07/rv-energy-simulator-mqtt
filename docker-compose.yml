services:
  simulator:
    build: .
    command: python simulator.py
    ports:
      - "5001:5001"
      - "1883:1883"
    volumes:
      - sim-data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: python broker_dashboard.py
    ports:
      - "5002:5002"
    depends_on:
      - simulator
    restart: unless-stopped

  dbgate:
    image: dbgate/dbgate
    ports:
      - "3000:3000"
    volumes:
      - sim-data:/app/data
      - dbgate-data:/root/.dbgate
    environment:
      CONNECTIONS: sqlite_db
      ENGINE_sqlite_db: sqlite@dbgate-plugin-sqlite
      LABEL_sqlite_db: RV Simulator DB
      FILE_sqlite_db: /app/data/simulator.db
    restart: unless-stopped

volumes:
  sim-data:
  dbgate-data:
