services:
  simulator:
    build: .
    command: python simulator.py
    ports:
      - "${SIMULATOR_PORT:-5001}:5001"   # Configurator UI
      - "${MQTT_PORT:-1883}:1883"        # Embedded MQTT broker
    volumes:
      - sim-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/api/simulate/live/status', timeout=2)\""]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 15s

  dashboard:
    build: .
    command: python broker_dashboard.py
    ports:
      - "${DASHBOARD_PORT:-5002}:5002"   # Real-time dashboard UI
    environment:
      - MQTT_HOST=simulator
      - MQTT_PORT=1883
      - SIMULATOR_HOST=simulator
    depends_on:
      simulator:
        condition: service_healthy
    restart: unless-stopped

  dbgate:
    image: dbgate/dbgate
    ports:
      - "${DBGATE_PORT:-3000}:3000"
    volumes:
      - sim-data:/app/data
      - dbgate-data:/root/.dbgate
    environment:
      CONNECTIONS: sqlite_db
      ENGINE_sqlite_db: sqlite@dbgate-plugin-sqlite
      LABEL_sqlite_db: RV Simulator DB
      FILE_sqlite_db: /app/data/simulator.db
    restart: unless-stopped

volumes:
  sim-data:
  dbgate-data:
