services:
  simulator:
    build: .
    command: python simulator.py
    ports:
      - "${SIMULATOR_PORT}:5001"   # Configurator UI
      - "${MQTT_PORT}:1883"        # Embedded MQTT broker
    volumes:
      - sim-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',1883),2); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  dashboard:
    build: .
    command: python broker_dashboard.py
    ports:
      - "${DASHBOARD_PORT}:5002"   # Real-time dashboard UI
    environment:
      - MQTT_HOST=simulator
      - MQTT_PORT=1883
      - SIMULATOR_HOST=simulator
    depends_on:
      simulator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sim-data:
