services:
  simulator:
    build: .
    command: python simulator.py
    ports:
      - "5001:5001"
      - "1883:1883"
    volumes:
      - sim-data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: python broker_dashboard.py
    ports:
      - "5002:5002"
    depends_on:
      - simulator
    restart: unless-stopped

volumes:
  sim-data:
